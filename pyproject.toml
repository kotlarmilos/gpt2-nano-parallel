[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt2-nano-parallel"
version = "0.1.0rc1"
description = "Measured NCCL collective timing models and composition evaluation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Milos Kotlar" }]
dependencies = []

[project.optional-dependencies]
gpu = ["torch>=2.2"]

[project.scripts]
gpt2-parallel-nccl = "gpt2_nano_parallel.gpu_collectives:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpt2_nano_parallel = ["py.typed"]
