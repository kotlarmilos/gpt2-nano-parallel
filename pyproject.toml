[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt2-nano-parallel"
version = "0.1.0rc1"
description = "Executable calculators and CPU simulations for five transformer parallelism strategies"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Milos Kotlar" }]
dependencies = []

[project.optional-dependencies]
cpu-demo = ["torch>=2.2"]
test = ["pytest>=8"]

[project.scripts]
gpt2-parallel = "gpt2_nano_parallel.cli:main"
gpt2-parallel-allreduce = "gpt2_nano_parallel.allreduce_validation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpt2_nano_parallel = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
